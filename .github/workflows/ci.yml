name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Locked baseline
            selected: false
            graph: '{"@earendil-works/pi-agent-core":"1.5.1","@earendil-works/pi-ai":"1.5.1","@earendil-works/pi-codemode":"1.5.1","@earendil-works/pi-coding-agent":"1.5.1","@earendil-works/pi-mcp":"1.5.1","@earendil-works/pi-schema":"1.5.1","@earendil-works/pi-telemetry":"1.5.1","@earendil-works/pi-tui":"1.5.1"}'
          - name: Pi 1.6 compatibility
            selected: true
            graph: '{"@earendil-works/pi-agent-core":"1.6.0","@earendil-works/pi-ai":"1.6.0","@earendil-works/pi-codemode":"1.6.0","@earendil-works/pi-coding-agent":"1.6.0","@earendil-works/pi-mcp":"1.6.0","@earendil-works/pi-schema":"1.6.0","@earendil-works/pi-telemetry":"1.6.0","@earendil-works/pi-tui":"1.6.0"}'
    env:
      PI_GRAPH_EXPECTED: ${{ matrix.graph }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        id: setup_bun
        with:
          bun-version: latest
      - name: Verify resolved Bun version and minimum
        env:
          EXPECTED_BUN_VERSION: ${{ steps.setup_bun.outputs.bun-version }}
        run: |
          bun -e '
            const actual = Bun.version;
            const expected = process.env.EXPECTED_BUN_VERSION;
            if (!expected || actual !== expected) {
              throw new Error(`Bun version mismatch: expected ${expected}, running ${actual}`);
            }
            if (!Bun.semver.satisfies(actual, ">=1.4.2")) {
              throw new Error(`Bun ${actual} is below the required minimum 1.4.2`);
            }
            console.log(`Verified Bun ${actual} (minimum 1.4.2)`);
          '
      - name: Install locked dependencies
        if: '!matrix.selected'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install selected Pi compatibility graph
        id: selected_install
        if: matrix.selected
        run: |
          set -euo pipefail
          original=$(mktemp "$RUNNER_TEMP/pi-sudo-package.XXXXXX")
          cp package.json "$original"
          printf 'original=%s\n' "$original" >> "$GITHUB_OUTPUT"
          bun -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const graph = JSON.parse(process.env.PI_GRAPH_EXPECTED);
            Object.assign(pkg.devDependencies, graph);
            pkg.overrides = graph;
            writeFileSync("package.json", JSON.stringify(pkg, null, "\t") + "\n");
          '
          bun install --no-save --ignore-scripts
      - name: Verify exact Pi runtime graph
        run: |
          bun .github/scripts/verify-pi-graph.ts --self-test
          bun .github/scripts/verify-pi-graph.ts
      - name: Type check
        run: bun run check
      - name: Unit and regression tests (no privileged authentication)
        run: bun test
      - name: Check diagram Markdown synchronization
        run: bun run docs:check
      - name: Restore the selected manifest
        if: always() && matrix.selected && steps.selected_install.outputs.original != ''
        env:
          ORIGINAL_MANIFEST: ${{ steps.selected_install.outputs.original }}
        run: mv -- "$ORIGINAL_MANIFEST" package.json
      - name: Confirm tracked files are unchanged
        if: always()
        run: git diff --exit-code
