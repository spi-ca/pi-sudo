name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Locked baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PI_GRAPH_EXPECTED: '{"@earendil-works/pi-agent-core":"1.3.0","@earendil-works/pi-ai":"1.3.0","@earendil-works/pi-codemode":"1.3.0","@earendil-works/pi-coding-agent":"1.3.0","@earendil-works/pi-mcp":"1.3.0","@earendil-works/pi-telemetry":"1.3.0","@earendil-works/pi-tui":"1.3.0"}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        id: setup_bun
        with:
          bun-version: latest
      - name: Verify resolved Bun version and minimum
        env:
          EXPECTED_BUN_VERSION: ${{ steps.setup_bun.outputs.bun-version }}
        run: |
          bun -e '
            const actual = Bun.version;
            const expected = process.env.EXPECTED_BUN_VERSION;
            if (!expected || actual !== expected) {
              throw new Error(`Bun version mismatch: expected ${expected}, running ${actual}`);
            }
            if (!Bun.semver.satisfies(actual, ">=1.4.2")) {
              throw new Error(`Bun ${actual} is below the required minimum 1.4.2`);
            }
            console.log(`Verified Bun ${actual} (minimum 1.4.2)`);
          '
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify exact Pi runtime graph
        run: |
          bun .github/scripts/verify-pi-graph.ts --self-test
          bun .github/scripts/verify-pi-graph.ts
      - name: Type check
        run: bun run check
      - name: Unit and regression tests (no privileged authentication)
        run: bun test
      - name: Check diagram Markdown synchronization
        run: bun run docs:check
      - name: Confirm tracked files are unchanged
        run: git diff --exit-code
