name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Locked baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PI_GRAPH_EXPECTED: '{"@earendil-works/chord":"0.99.2","@earendil-works/pi-agent-core":"0.99.2","@earendil-works/pi-ai":"0.99.2","@earendil-works/pi-codemode":"0.99.2","@earendil-works/pi-coding-agent":"0.99.2","@earendil-works/pi-mcp":"0.99.2","@earendil-works/pi-telemetry":"0.99.2","@earendil-works/pi-tui":"0.99.2"}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify exact Pi runtime graph
        run: |
          bun .github/scripts/verify-pi-graph.ts --self-test
          bun .github/scripts/verify-pi-graph.ts
      - name: Type check
        run: bun run check
      - name: Unit and regression tests (no privileged authentication)
        run: bun test
      - name: Check diagram Markdown synchronization
        run: bun run docs:check
      - name: Confirm tracked files are unchanged
        run: git diff --exit-code
